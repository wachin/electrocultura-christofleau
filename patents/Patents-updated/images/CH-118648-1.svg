<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BBDEFB"/>
      <stop offset="100%" stop-color="#E3F2FD"/>
    </linearGradient>
    <linearGradient id="post5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="50%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#5D4037"/>
    </linearGradient>
    <linearGradient id="zinc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B0BEC5"/>
      <stop offset="100%" stop-color="#78909C"/>
    </linearGradient>
    <linearGradient id="copper5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#D35400"/>
    </linearGradient>
    <marker id="arrowY5" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F9A825"/>
    </marker>
    <marker id="arrowW5" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E0E0E0"/>
    </marker>
  </defs>

  <!-- Sky background -->
  <rect width="900" height="750" fill="url(#sky)"/>
  
  <!-- Clouds -->
  <ellipse cx="200" cy="80" rx="80" ry="30" fill="white" opacity="0.8"/>
  <ellipse cx="250" cy="75" rx="60" ry="25" fill="white" opacity="0.7"/>
  <ellipse cx="150" cy="85" rx="50" ry="20" fill="white" opacity="0.6"/>
  
  <ellipse cx="650" cy="60" rx="70" ry="25" fill="white" opacity="0.7"/>
  <ellipse cx="700" cy="55" rx="55" ry="22" fill="white" opacity="0.6"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A237E">CH 118648 — Recolector de Electricidad Atmosférica</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#333">Vista en elevación con poste y antenas</text>

  <!-- Ground level -->
  <line x1="0" y1="580" x2="900" y2="580" stroke="#5D4037" stroke-width="3"/>
  <rect x="0" y="580" width="900" height="170" fill="#8D6E63" opacity="0.3"/>
  <text x="450" y="600" text-anchor="middle" font-size="11" fill="#5D4037" font-weight="bold">▼ SUELO ▼</text>

  <!-- Post -->
  <rect x="440" y="200" width="20" height="380" fill="url(#post5)" stroke="#4E342E" stroke-width="2"/>
  
  <!-- Post base -->
  <rect x="420" y="560" width="60" height="30" fill="#5D4037" stroke="#3E2723" stroke-width="2" rx="3"/>

  <!-- === THE APPARATUS === -->
  
  <!-- Box A (main housing) -->
  <rect x="380" y="140" width="140" height="70" fill="#ECEFF1" stroke="#455A64" stroke-width="2.5" rx="5"/>
  
  <!-- Steel magnetized plates on sides -->
  <rect x="375" y="150" width="8" height="50" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  <rect x="517" y="150" width="8" height="50" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  
  <!-- Zinc tray on top -->
  <rect x="370" y="125" width="160" height="18" fill="url(#zinc)" stroke="#455A64" stroke-width="2" rx="3"/>
  <text x="450" y="138" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">PLATILLO DE ZINC</text>
  
  <!-- Copper plate (inside zinc tray) -->
  <rect x="385" y="130" width="130" height="10" fill="url(#copper5)" stroke="#8D6E63" stroke-width="1" rx="2"/>
  <text x="450" y="155" text-anchor="middle" font-size="8" fill="#8D6E63">PLACA DE COBRE</text>
  
  <!-- Tail B (south-pointing magnetic metal) -->
  <polygon points="380,175 380,200 340,187" fill="#78909C" stroke="#455A64" stroke-width="2"/>
  
  <!-- Stem I' -->
  <rect x="447" y="70" width="6" height="70" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  
  <!-- Antennas L (flexible metal) -->
  <!-- Left antennas -->
  <path d="M 450 70 Q 420 40 400 20" fill="none" stroke="#B0BEC5" stroke-width="2"/>
  <path d="M 450 70 Q 430 35 380 15" fill="none" stroke="#B0BEC5" stroke-width="2"/>
  <path d="M 450 70 Q 410 45 390 25" fill="none" stroke="#B0BEC5" stroke-width="2"/>
  <path d="M 450 70 Q 425 30 370 10" fill="none" stroke="#B0BEC5" stroke-width="2"/>
  <path d="M 450 70 Q 435 50 410 35" fill="none" stroke="#B0BEC5" stroke-width="2"/>
  
  <!-- Right antennas -->
  <path d="M 450 70 Q 480 40 500 20" fill="none" stroke="#B0BEC5" stroke-width="2"/>
  <path d="M 450 70 Q 470 35 520 15" fill="none" stroke="#B0BEC5" stroke-width="2"/>
  <path d="M 450 70 Q 490 45 510 25" fill="none" stroke="#B0BEC5" stroke-width="2"/>
  <path d="M 450 70 Q 475 30 530 10" fill="none" stroke="#B0BEC5" stroke-width="2"/>
  <path d="M 450 70 Q 465 50 490 35" fill="none" stroke="#B0BEC5" stroke-width="2"/>
  
  <!-- Center antennas -->
  <path d="M 450 70 Q 450 40 450 15" fill="none" stroke="#B0BEC5" stroke-width="2"/>
  <path d="M 450 70 Q 445 35 440 10" fill="none" stroke="#B0BEC5" stroke-width="2"/>
  <path d="M 450 70 Q 455 35 460 10" fill="none" stroke="#B0BEC5" stroke-width="2"/>

  <!-- Labels -->
  <!-- A - Box -->
  <line x1="520" y1="175" x2="600" y2="140" stroke="#333" stroke-width="1"/>
  <rect x="575" y="125" width="100" height="25" fill="white" stroke="#333" rx="3"/>
  <text x="625" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">A — Caja</text>
  <text x="625" y="155" text-anchor="middle" font-size="9" fill="#666">(metal magnético)</text>
  
  <!-- B - Tail -->
  <line x1="345" y1="187" x2="250" y2="187" stroke="#333" stroke-width="1"/>
  <rect x="200" y="178" width="60" height="25" fill="white" stroke="#333" rx="3"/>
  <text x="230" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">B — Cola</text>
  <text x="230" y="210" text-anchor="middle" font-size="9" fill="#666">(sur magnético)</text>
  
  <!-- I' - Stem -->
  <line x1="453" y1="100" x2="560" y2="85" stroke="#333" stroke-width="1"/>
  <rect x="540" y="75" width="40" height="22" fill="white" stroke="#333" rx="3"/>
  <text x="560" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">I'</text>
  <text x="560" y="105" text-anchor="middle" font-size="9" fill="#666">Vástago</text>
  
  <!-- L - Antennas -->
  <line x1="530" y1="40" x2="620" y2="40" stroke="#333" stroke-width="1"/>
  <rect x="600" y="30" width="40" height="22" fill="white" stroke="#333" rx="3"/>
  <text x="620" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">L</text>
  <text x="660" y="38" text-anchor="middle" font-size="9" fill="#666">Antenas metálicas</text>
  <text x="660" y="50" text-anchor="middle" font-size="9" fill="#666">flexibles</text>

  <!-- Wind arrows -->
  <g opacity="0.5">
    <line x1="300" y1="50" x2="370" y2="50" stroke="#90A4AE" stroke-width="2" marker-end="url(#arrowW5)"/>
    <line x1="310" y1="70" x2="380" y2="70" stroke="#90A4AE" stroke-width="2" marker-end="url(#arrowW5)"/>
    <line x1="290" y1="90" x2="360" y2="90" stroke="#90A4AE" stroke-width="2" marker-end="url(#arrowW5)"/>
    <text x="325" y="45" text-anchor="middle" font-size="10" fill="#78909C" font-style="italic">VIENTO</text>
  </g>

  <!-- Electricity collection arrows -->
  <line x1="450" y1="15" x2="450" y2="55" stroke="#F9A825" stroke-width="2.5" marker-end="url(#arrowY5)"/>
  <text x="450" y="10" text-anchor="middle" font-size="10" fill="#F9A825" font-weight="bold">⚡ Electricidad estática</text>
  
  <!-- Induction from clouds -->
  <path d="M 200 100 Q 300 130 380 130" fill="none" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="5,3"/>
  <path d="M 650 80 Q 550 120 520 130" fill="none" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="290" y="125" font-size="9" fill="#FF9800">Inducción de nubes</text>

  <!-- Magnetic field around tail -->
  <path d="M 340 175 Q 320 160 330 187 Q 320 215 340 200" fill="none" stroke="#7B1FA2" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- Function explanation boxes -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="200" height="90" fill="white" stroke="#F9A825" rx="5" opacity="0.95"/>
    <text x="100" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#F9A825">⚡ RECOLECCIÓN</text>
    <text x="100" y="35" text-anchor="middle" font-size="9" fill="#333">Las antenas L recolectan:</text>
    <text x="100" y="48" text-anchor="middle" font-size="9" fill="#333">• Electricidad del aire</text>
    <text x="100" y="61" text-anchor="middle" font-size="9" fill="#333">• Inducción de nubes</text>
    <text x="100" y="74" text-anchor="middle" font-size="9" fill="#333">• Electricidad por frotamiento</text>
    <text x="100" y="87" text-anchor="middle" font-size="9" fill="#333">(con viento lento)</text>
  </g>

  <g transform="translate(650, 250)">
    <rect x="0" y="0" width="200" height="90" fill="white" stroke="#78909C" rx="5" opacity="0.95"/>
    <text x="100" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#78909C">🧲 IMANES</text>
    <text x="100" y="35" text-anchor="middle" font-size="9" fill="#333">Placas de acero magnetizado</text>
    <text x="100" y="48" text-anchor="middle" font-size="9" fill="#333">en caras laterales de caja A</text>
    <text x="100" y="61" text-anchor="middle" font-size="9" fill="#333">• Refuerzan campo magnético</text>
    <text x="100" y="74" text-anchor="middle" font-size="9" fill="#333">• Atraen corrientes terrestres</text>
    <text x="100" y="87" text-anchor="middle" font-size="9" fill="#333">• Complementan antenas</text>
  </g>

  <!-- Connection to ground -->
  <line x1="450" y1="570" x2="450" y2="590" stroke="#C62828" stroke-width="3"/>
  <text x="450" y="615" text-anchor="middle" font-size="10" fill="#C62828" font-weight="bold">Conductor a tierra</text>
  <text x="450" y="628" text-anchor="middle" font-size="9" fill="#C62828">(red distribuidora)</text>

  <!-- Height annotation -->
  <line x1="350" y1="200" x2="350" y2="570" stroke="#333" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="345" y="390" text-anchor="middle" font-size="10" fill="#333" transform="rotate(-90, 345, 390)">Altura: 3-5 metros sobre el suelo</text>

  <!-- Compass -->
  <g transform="translate(120, 430)">
    <circle cx="0" cy="0" r="30" fill="white" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="-24" x2="0" y2="-6" stroke="#D32F2F" stroke-width="3"/>
    <line x1="0" y1="6" x2="0" y2="24" stroke="#1565C0" stroke-width="3"/>
    <text x="0" y="-28" text-anchor="middle" font-size="11" font-weight="bold" fill="#D32F2F">N</text>
    <text x="0" y="38" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">S</text>
    <text x="-35" y="5" text-anchor="middle" font-size="9" fill="#333">O</text>
    <text x="35" y="5" text-anchor="middle" font-size="9" fill="#333">E</text>
    <circle cx="0" cy="0" r="3" fill="#333"/>
  </g>

</svg>
