<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 750" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="soil2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#654321"/>
    </linearGradient>
    <linearGradient id="iron2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#607D8B"/>
      <stop offset="50%" stop-color="#90A4AE"/>
      <stop offset="100%" stop-color="#607D8B"/>
    </linearGradient>
    <marker id="arrowR2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D32F2F"/>
    </marker>
    <marker id="arrowB2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
    <marker id="arrowG2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="950" height="750" fill="#F5F5F0"/>

  <!-- Title -->
  <text x="475" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">CH 172269 — Aparato de Electroicultura Subterráneo</text>
  <text x="475" y="55" text-anchor="middle" font-size="13" fill="#666">Vista lateral en sección con red de distribución</text>

  <!-- Ground level -->
  <line x1="30" y1="250" x2="920" y2="250" stroke="#5D4037" stroke-width="3" stroke-dasharray="12,6"/>
  <text x="475" y="240" text-anchor="middle" font-size="12" fill="#5D4037" font-weight="bold">▼ NIVEL DEL SUELO ▼</text>

  <!-- Soil -->
  <rect x="30" y="250" width="890" height="420" fill="url(#soil2)" opacity="0.25" rx="5"/>

  <!-- Atmosphere -->
  <rect x="30" y="65" width="890" height="185" fill="#E3F2FD" opacity="0.3" rx="5"/>
  <text x="475" y="85" text-anchor="middle" font-size="11" fill="#1565C0" font-style="italic">ATMÓSFERA</text>

  <!-- === APPARATUS (U-shape) === -->
  
  <!-- Left arm of U -->
  <rect x="350" y="300" width="40" height="180" fill="url(#iron2)" stroke="#455A64" stroke-width="2"/>
  
  <!-- Right arm of U -->
  <rect x="560" y="300" width="40" height="180" fill="url(#iron2)" stroke="#455A64" stroke-width="2"/>
  
  <!-- Bottom of U -->
  <rect x="350" y="460" width="250" height="20" fill="url(#iron2)" stroke="#455A64" stroke-width="2"/>
  
  <!-- South tip B (pointed, left side) -->
  <polygon points="350,300 350,480 310,390" fill="url(#iron2)" stroke="#455A64" stroke-width="2"/>
  
  <!-- Label A -->
  <line x1="475" y1="400" x2="475" y2="350" stroke="#333" stroke-width="1"/>
  <rect x="455" y="330" width="40" height="20" fill="white" stroke="#333" rx="3"/>
  <text x="475" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">A</text>
  <text x="475" y="325" text-anchor="middle" font-size="9" fill="#666">Cuerpo en U</text>
  <text x="475" y="315" text-anchor="middle" font-size="9" fill="#666">(metal magnético)</text>

  <!-- Label B - South tip -->
  <line x1="320" y1="390" x2="220" y2="350" stroke="#333" stroke-width="1"/>
  <rect x="170" y="335" width="100" height="20" fill="white" stroke="#333" rx="3"/>
  <text x="220" y="349" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">B</text>
  <text x="220" y="330" text-anchor="middle" font-size="9" fill="#666">Punta sur (recolección S→N)</text>

  <!-- Plate C with teeth (top) -->
  <!-- Base plate -->
  <rect x="330" y="285" width="290" height="12" fill="#78909C" stroke="#455A64" stroke-width="1.5"/>
  
  <!-- Teeth on left side -->
  <polygon points="330,285 320,275 330,275" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  <polygon points="350,285 340,270 350,270" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  <polygon points="370,285 360,270 370,270" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  <polygon points="390,285 380,270 390,270" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  <polygon points="410,285 400,270 410,270" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  <polygon points="430,285 420,270 430,270" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  <polygon points="450,285 440,270 450,270" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  <polygon points="470,285 460,270 470,270" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  <polygon points="490,285 480,270 490,270" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  <polygon points="510,285 500,270 510,270" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  <polygon points="530,285 520,270 530,270" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  <polygon points="550,285 540,270 550,270" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  <polygon points="570,285 560,270 570,270" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  <polygon points="590,285 580,270 590,270" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  <polygon points="610,285 600,270 610,270" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  <polygon points="620,285 615,275 620,275" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  
  <!-- Tail teeth (south side) -->
  <polygon points="330,290 310,280 310,295 330,297" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  <polygon points="315,288 290,275 290,295 315,297" fill="#78909C" stroke="#455A64" stroke-width="1"/>
  
  <!-- Label C -->
  <line x1="475" y1="270" x2="475" y2="220" stroke="#333" stroke-width="1"/>
  <rect x="440" y="200" width="70" height="20" fill="white" stroke="#333" rx="3"/>
  <text x="475" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">C</text>
  <text x="475" y="195" text-anchor="middle" font-size="9" fill="#666">Placa dentada</text>
  <text x="475" y="185" text-anchor="middle" font-size="9" fill="#666">(corrientes E↔O)</text>

  <!-- Spike points D (top) -->
  <line x1="370" y1="285" x2="370" y2="260" stroke="#78909C" stroke-width="3"/>
  <line x1="410" y1="285" x2="410" y2="260" stroke="#78909C" stroke-width="3"/>
  <line x1="450" y1="285" x2="450" y2="260" stroke="#78909C" stroke-width="3"/>
  <line x1="490" y1="285" x2="490" y2="260" stroke="#78909C" stroke-width="3"/>
  <line x1="530" y1="285" x2="530" y2="260" stroke="#78909C" stroke-width="3"/>
  <line x1="570" y1="285" x2="570" y2="260" stroke="#78909C" stroke-width="3"/>
  <line x1="610" y1="285" x2="610" y2="260" stroke="#78909C" stroke-width="3"/>
  
  <!-- Label D -->
  <line x1="610" y1="260" x2="680" y2="230" stroke="#333" stroke-width="1"/>
  <rect x="650" y="218" width="80" height="20" fill="white" stroke="#333" rx="3"/>
  <text x="690" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">D</text>
  <text x="690" y="213" text-anchor="middle" font-size="9" fill="#666">Puntas melladas</text>
  <text x="690" y="203" text-anchor="middle" font-size="9" fill="#666">(inducción atmósfera)</text>

  <!-- Nose E (north side) -->
  <path d="M 600,300 L 640,320 L 640,380 L 600,400" fill="url(#iron2)" stroke="#455A64" stroke-width="2"/>
  
  <!-- Label E -->
  <line x1="640" y1="350" x2="720" y2="320" stroke="#333" stroke-width="1"/>
  <rect x="690" y="308" width="80" height="20" fill="white" stroke="#333" rx="3"/>
  <text x="730" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">E</text>
  <text x="730" y="303" text-anchor="middle" font-size="9" fill="#666">Nariz norte</text>
  <text x="730" y="293" text-anchor="middle" font-size="9" fill="#666">(salida de energía)</text>

  <!-- Bolt F -->
  <circle cx="640" cy="350" r="6" fill="#FF9800" stroke="#E65100" stroke-width="1.5"/>
  <line x1="640" y1="350" x2="640" y2="340" stroke="#333" stroke-width="1"/>
  <text x="640" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">F</text>

  <!-- Cable G (distribution network) -->
  <path d="M 646 350 L 700 350 L 700 500 L 800 500 L 800 520" fill="none" stroke="#B71C1C" stroke-width="3"/>
  <path d="M 700 400 L 750 400 L 750 480" fill="none" stroke="#B71C1C" stroke-width="2"/>
  <path d="M 700 450 L 780 450 L 780 530" fill="none" stroke="#B71C1C" stroke-width="2"/>
  
  <!-- Distribution branches underground -->
  <line x1="700" y1="500" x2="850" y2="500" stroke="#B71C1C" stroke-width="2"/>
  <line x1="750" y1="480" x2="850" y2="480" stroke="#B71C1C" stroke-width="2"/>
  <line x1="780" y1="530" x2="850" y2="530" stroke="#B71C1C" stroke-width="2"/>
  
  <!-- Energy dots along cables -->
  <circle cx="720" cy="500" r="3" fill="#FF5722"/>
  <circle cx="760" cy="500" r="3" fill="#FF5722"/>
  <circle cx="800" cy="500" r="3" fill="#FF5722"/>
  <circle cx="770" cy="480" r="3" fill="#FF5722"/>
  <circle cx="810" cy="480" r="3" fill="#FF5722"/>
  <circle cx="800" cy="530" r="3" fill="#FF5722"/>
  <circle cx="830" cy="530" r="3" fill="#FF5722"/>
  
  <!-- Label G -->
  <line x1="770" y1="500" x2="830" y2="560" stroke="#333" stroke-width="1"/>
  <rect x="800" y="548" width="100" height="20" fill="white" stroke="#333" rx="3"/>
  <text x="850" y="562" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">G</text>
  <text x="850" y="580" text-anchor="middle" font-size="9" fill="#666">Red distribuidora</text>
  <text x="850" y="590" text-anchor="middle" font-size="9" fill="#666">subterránea</text>

  <!-- Clamp H -->
  <rect x="695" y="345" width="12" height="12" fill="#FF9800" stroke="#E65100" stroke-width="1.5" rx="2"/>
  <line x1="701" y1="345" x2="701" y2="335" stroke="#333" stroke-width="1"/>
  <text x="701" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">H</text>
  <text x="701" y="320" text-anchor="middle" font-size="9" fill="#666">Abrazadera</text>

  <!-- Magnetic poles -->
  <rect x="280" y="375" width="25" height="18" fill="#D32F2F" rx="3"/>
  <text x="292" y="388" text-anchor="middle" font-size="11" font-weight="bold" fill="white">S</text>
  
  <rect x="640" y="290" width="25" height="18" fill="#1565C0" rx="3"/>
  <text x="652" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="white">N</text>

  <!-- Compass -->
  <g transform="translate(850, 130)">
    <circle cx="0" cy="0" r="35" fill="white" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="-28" x2="0" y2="-8" stroke="#D32F2F" stroke-width="3"/>
    <line x1="0" y1="8" x2="0" y2="28" stroke="#1565C0" stroke-width="3"/>
    <text x="0" y="-32" text-anchor="middle" font-size="12" font-weight="bold" fill="#D32F2F">N</text>
    <text x="0" y="42" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">S</text>
    <circle cx="0" cy="0" r="3" fill="#333"/>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 500)">
    <rect x="0" y="0" width="210" height="110" fill="white" stroke="#ccc" rx="5" opacity="0.95"/>
    <text x="105" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">LEYENDA</text>
    <rect x="15" y="28" width="15" height="10" fill="url(#iron2)"/>
    <text x="40" y="37" font-size="9" fill="#333">Metal magnético</text>
    <rect x="15" y="45" width="15" height="10" fill="#78909C"/>
    <text x="40" y="54" font-size="9" fill="#333">Placa dentada / puntas</text>
    <line x1="15" y1="70" x2="30" y2="70" stroke="#B71C1C" stroke-width="3"/>
    <text x="40" y="74" font-size="9" fill="#333">Cable distribuidor</text>
    <rect x="15" y="82" width="15" height="10" fill="#FF9800"/>
    <text x="40" y="91" font-size="9" fill="#333">Abrazadera / perno</text>
    <circle cx="22" cy="102" r="3" fill="#FF5722"/>
    <text x="40" y="106" font-size="9" fill="#333">Puntos de distribución</text>
  </g>

  <!-- Earth current arrows -->
  <line x1="200" y1="350" x2="280" y2="350" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrowG2)"/>
  <text x="240" y="340" text-anchor="middle" font-size="9" fill="#2E7D32">Corrientes S→N</text>
  
  <line x1="400" y1="260" x2="400" y2="290" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowB2)"/>
  <line x1="475" y1="260" x2="475" y2="290" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowB2)"/>
  <line x1="550" y1="260" x2="550" y2="290" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowB2)"/>

  <!-- Cross-section view indicator -->
  <g transform="translate(50, 290)">
    <rect x="0" y="0" width="180" height="130" fill="white" stroke="#ccc" rx="5" opacity="0.95"/>
    <text x="90" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">VISTA EN CORTE (X-X')</text>
    
    <!-- Cross section of U -->
    <rect x="30" y="35" width="15" height="60" fill="url(#iron2)" stroke="#455A64" stroke-width="1.5"/>
    <rect x="135" y="35" width="15" height="60" fill="url(#iron2)" stroke="#455A64" stroke-width="1.5"/>
    <rect x="30" y="85" width="120" height="10" fill="url(#iron2)" stroke="#455A64" stroke-width="1.5"/>
    
    <!-- Cable in cross section -->
    <circle cx="90" cy="55" r="5" fill="#B71C1C" stroke="#880E4F" stroke-width="1"/>
    
    <!-- Arrow showing cable -->
    <line x1="95" y1="55" x2="160" y2="55" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="165" y="58" font-size="8" fill="#333">Cable G</text>
    
    <!-- Plate on top -->
    <rect x="25" y="28" width="130" height="7" fill="#78909C" stroke="#455A64" stroke-width="1"/>
    <text x="90" y="115" text-anchor="middle" font-size="9" fill="#666">Sección transversal del aparato</text>
  </g>

</svg>
